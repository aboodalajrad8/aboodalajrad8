<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 500 30'
    style='background-color: #00000000;'
    width='500px' height='30px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 300;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='5800ms' fill='remove'
                    values='m0,15 h0 ; m0,15 h500 ; m0,15 h500 ; m0,15 h0' keyTimes='0;0.68965517241379;0.82758620689655;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#8A8A9A' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            ✦ clean code ✦ sharp interaction ✦ real impact ✦
        </textPath>
    </text>
</svg>
